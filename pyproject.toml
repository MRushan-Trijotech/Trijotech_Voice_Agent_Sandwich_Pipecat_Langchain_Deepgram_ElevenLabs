[project]
name = "trijotech_VoiceAgent"
version = "0.1.0"
description = "A gym customer-support agent built with LangChain/LangGraph multi-agent handoffs (Option A: agents as graph nodes), served as both a text chat and a Pipecat voice bot, traced to LangSmith."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langsmith>=0.8.18",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pipecat-ai[deepgram,elevenlabs,google,openai,silero,tracing,webrtc,websocket]>=1.4.0",
    "pipecat-ai-prebuilt>=1.0.2",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "langchain-google-genai>=4.4.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "langchain-postgres>=0.0.19",
    "asyncpg>=0.32.0",
    "tzdata>=2026.5",
]

[project.scripts]
pipecat-langgraph-example = "trijotech_VoiceAgent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trijotech_VoiceAgent"]
